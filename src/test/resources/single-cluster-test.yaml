# Synthetic single-cluster fixtures with the legacy Compose command.
local:
  build:
    type: maven
    projects:
      - name: library
        path: ~/example-workspace/library
        arguments: [-DskipTests=true, clean, install]
  docker:
    compose: compose/single/docker-compose.yaml
    compose-command: [docker-compose]
remote:
  default-cluster: alpha
  clusters:
    - name: alpha
      control: ssh
  environments:
    - name: qa
      cluster: alpha
      build-environment: validation
      deploy:
        type: scp
        host: staging-publisher.example.test
        user: test-publisher
        path: /srv/example-deploy
  hosts:
    - name: alpha-node-1.example.test
      cluster: alpha
      aliases: [node-1]
      ssh-user: test-admin
  groups:
    - name: nodes
      cluster: alpha
      hosts: [node-1]
